name: Deploy to Databricks

on:
  push:
    branches: [main]

concurrency:
  group: deploy-databricks
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Remove app.yaml before upload
        run: rm -f app.yaml

      - name: Upload changed files
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          BASE=/Workspace/Users/${{ secrets.DATABRICKS_USER }}/dashboard-labs-and-tracks

          FILES=$(git diff --name-only --diff-filter=ACM HEAD~1 HEAD)

          if [ -z "$FILES" ]; then
            echo "Nenhum arquivo modificado, nada a subir."
            exit 0
          fi

          echo "Arquivos a subir:"
          echo "$FILES"

          echo "$FILES" | while read f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            [ "$f" = "app.yaml" ] && continue

            dir=$(dirname "$f")
            if [ "$dir" != "." ]; then
              databricks workspace mkdirs "$BASE/$dir" 2>/dev/null || true
            fi
            databricks workspace import "$BASE/$f" --file "$f" --overwrite --format AUTO
            echo "✓ $f"
          done

      - name: Deploy app
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          rm -rf .databricks
          databricks apps deploy dashboard-labs-and-tracks \
            --source-code-path /Workspace/Users/${{ secrets.DATABRICKS_USER }}/dashboard-labs-and-tracks