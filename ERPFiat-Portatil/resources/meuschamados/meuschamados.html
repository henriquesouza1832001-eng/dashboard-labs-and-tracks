<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meus Chamados</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="/meuschamados/meuschamados.css" rel="stylesheet">
</head>
<body>
<!-- ===== VIEW MEUS CHAMADOS ===== -->
<div id="view-meus" style="display:none">

  <!-- Cabeçalho com nome do solicitante -->
  <div class="mc-header">
    <div class="mc-header-inner">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <div>
        <div class="mc-header-label">Quem está acessando?</div>
        <input type="text" id="mc-nome" class="mc-nome-input" placeholder="Seu nome ou matrícula…" autocomplete="off">
      </div>
    </div>
  </div>

  <!-- Sub-abas -->
  <div class="mc-tabs">
    <button class="mc-tab active" id="mc-tab-historico">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Meus Chamados
    </button>
    <button class="mc-tab" id="mc-tab-qr">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="14" width="3" height="3"/><rect x="14" y="18" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/></svg>
      Escanear QR Code
    </button>
    <button class="mc-tab" id="mc-tab-area">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Abrir Chamado
    </button>
  </div>

  <!-- VIEW: Histórico -->
  <div id="mc-view-historico" class="mc-view">
    <div id="mc-historico-lista" class="mc-lista"></div>
  </div>

  <!-- VIEW: QR Code -->
  <div id="mc-view-qr" class="mc-view" style="display:none">
    <div id="mc-qr-lista"></div>
  </div>

  <!-- VIEW: Abrir por área -->
  <div id="mc-view-area" class="mc-view" style="display:none">
    <div class="mc-form-wrap">
      <div class="mc-form-titulo-sec">Nova solicitação por área</div>
      <p class="mc-instrucao">Selecione a área onde está o problema. O local será preenchido automaticamente.</p>

      <div class="form-group">
        <label class="form-label">Área / Local *</label>
        <select class="form-control" id="mc-area-select">
          <option value="">Selecionar área…</option>
        </select>
        <div id="mc-form-local-info" style="font-size:12px;color:var(--text-muted);margin-top:5px;min-height:16px"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Categoria *</label>
          <select class="form-control" id="mc-form-cat">
            <option value="">Selecionar…</option>
            <option value="INF">Infraestrutura / Civil</option>
            <option value="ELE">Elétrica</option>
            <option value="HID">Hidráulica</option>
            <option value="LMP">Limpeza / Higiene</option>
            <option value="AR">Ar Condicionado</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Prioridade</label>
          <select class="form-control" id="mc-form-prio">
            <option value="Baixa">Baixa</option>
            <option value="Média" selected>Média</option>
            <option value="Alta">Alta</option>
            <option value="Crítica">Crítica</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Título *</label>
        <input type="text" class="form-control" id="mc-form-titulo" placeholder="Ex: Torneira com vazamento, Lâmpada queimada…">
      </div>

      <div class="form-group">
        <label class="form-label">Descrição *</label>
        <textarea class="form-control" id="mc-form-desc" rows="4" placeholder="Descreva o problema com detalhes: o que acontece, desde quando, impacto…"></textarea>
      </div>

      <div class="form-group">
        <div class="form-label">Fotos (opcional)</div>
        <div class="fotos-grid" id="mc-fotos-grid">
          <button type="button" class="foto-add-btn" id="mc-add-foto">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Adicionar
          </button>
        </div>
        <input type="file" id="mc-file-input" accept="image/*" multiple style="display:none">
      </div>

      <button class="btn btn-primary mc-abrir-btn" id="mc-area-abrir">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Registrar Chamado
      </button>
    </div>
  </div>

</div>
<script src="/meuschamados/meuschamados.js"></script>
</body>
</html>
